[project]
name = "koalaq-hub"
version = "0.1.0"
description = "KoalaQ Hub - A smart chatbot with tool integration capabilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Edoardo Cilia" }]
keywords = ["koalaq", "llm", "chatbot", "tools"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.32.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.8.2",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.4.2",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.7.0",
    "rich>=13.6.0",
    "openai>=1.12.0",
    "mcp>=1.0.0",
    "paho-mqtt>=2.2.1"
]

[project.scripts]
koalaq-hub = "koalaq_hub.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koalaq_hub"]

[tool.pyright]
include = ["koalaq_hub"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 300
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.uv]
dev-dependencies = ["pyright>=1.1.379", "pytest>=8.3.3", "ruff>=0.6.9"]
