# =====================================================
# EasyAccounts Server - Production Configuration
# =====================================================

# Temporary: Allow circular references (to be fixed later)
spring.main.allow-circular-references=true

# =====================================================
# Database Configuration
# =====================================================
# MYSQL_HOST: MySQL host address (default: db)
# MYSQL_PORT: MySQL port (default: 3306)
# MYSQL_USERNAME: MySQL username (default: root)
# DB_PASSWORD: MySQL password (default: easy_accounts)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/yd_jz?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:easy_accounts}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# Server port
server.port=8081

# =====================================================
# File Paths
# =====================================================
# Excel templates
baseAutoExcel=/Ledger/excel_template/auto_excel.xlsx
baseScreenExcel=/Ledger/excel_template/screen_excel.xlsx
# baseAnalysisExcel 已移除

# Excel output folders
excelAutoFolder=/Ledger/excel/month/
excelScreenFolder=/Ledger/excel/screen/
excelAnalysisFolder=/Ledger/excel/analysis/

# SQL backup folder
sqlBackUpFolder=/Ledger/backup/

# Image upload path
image.upload.path=/Ledger/images/

# Auth files folder
auth.folder=/Ledger/auth/

# =====================================================
# SQL Backup
# =====================================================
sqldumpCmd=/usr/bin/mysqldump -h ${MYSQL_HOST:db} -P ${MYSQL_PORT:3306} -u${MYSQL_USERNAME:root} -p${DB_PASSWORD:easy_accounts} --databases yd_jz >

# SQL_BACKUP_TIME: Cron expression for backup schedule (default: 22:00 daily)
cron.sqlBackupTime=${SQL_BACKUP_TIME:00 00 22 * * ?}

# =====================================================
# Authentication
# =====================================================
# ENABLE_LOGIN: Enable login authentication (default: false)
auth.enable=${ENABLE_LOGIN:false}

# EXPIRED_TIME: Token expiration in days (default: 30)
auth.expired=${EXPIRED_TIME:30}

# SINGLE_LOGIN: Single device login mode (default: true)
#   true = new login kicks old device
#   false = multi-device with shared token
auth.single_login=${SINGLE_LOGIN:true}

# =====================================================
# External Services
# =====================================================
webhook_url=http://webhook:8083/webhook

# =====================================================
# Logging
# =====================================================
logging.config=classpath:log4j2.xml

# =====================================================
# File Upload
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

# =====================================================
# Tomcat
# =====================================================
server.tomcat.connection-timeout=60000
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# =====================================================
# Liquibase
# =====================================================
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# =====================================================
# Version Info
# =====================================================
version.release=2.6.0
version.font_branch=4.0.0
version.backend_branch=2.5.1
version.mysql_branch=2.5.0
version.agent_branch=1.1.0
version.webhook_branch=1.0.0
