# =====================================================
# EasyAccounts Server - \u751F\u4EA7\u73AF\u5883\u914D\u7F6E
# =====================================================
# \u8BF4\u660E\uFF1A
# 1. \u4F7F\u7528\u73AF\u5883\u53D8\u91CF\u914D\u7F6E\u654F\u611F\u4FE1\u606F
# 2. \u73AF\u5883\u53D8\u91CF\u683C\u5F0F\uFF1A${\u53D8\u91CF\u540D:\u9ED8\u8BA4\u503C}
# 3. Docker \u90E8\u7F72\u65F6\u901A\u8FC7 docker-compose \u6CE8\u5165\u73AF\u5883\u53D8\u91CF
# =====================================================

# =====================================================
# \u6570\u636E\u5E93\u914D\u7F6E
# =====================================================
# MYSQL_HOST: \u6570\u636E\u5E93\u4E3B\u673A\uFF08\u9ED8\u8BA4: db\uFF09
# MYSQL_PORT: \u6570\u636E\u5E93\u7AEF\u53E3\uFF08\u9ED8\u8BA4: 3306\uFF09
# MYSQL_USERNAME: \u6570\u636E\u5E93\u7528\u6237\u540D\uFF08\u9ED8\u8BA4: root\uFF09
# DB_PASSWORD: \u6570\u636E\u5E93\u5BC6\u7801\uFF08\u9ED8\u8BA4: easy_accounts\uFF09
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/yd_jz?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:easy_accounts}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# MyBatis \u9A7C\u5CF0\u547D\u540D\u8F6C\u6362
mybatis.configuration.map-underscore-to-camel-case=true

# =====================================================
# \u670D\u52A1\u914D\u7F6E
# =====================================================
server.port=8081

# \u5FAA\u73AF\u4F9D\u8D56\uFF08\u4E34\u65F6\u65B9\u6848\uFF0C\u540E\u7EED\u4FEE\u590D\uFF09
spring.main.allow-circular-references=true

# Tomcat 线程优化（单用户场景，节省内存）
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1

# =====================================================
# \u6587\u4EF6\u8DEF\u5F84\u914D\u7F6E
# =====================================================
# Excel \u6A21\u677F\u8DEF\u5F84
baseAutoExcel=/Ledger/excel_template/auto_excel.xlsx
baseScreenExcel=/Ledger/excel_template/screen_excel.xlsx

# Excel \u8F93\u51FA\u8DEF\u5F84
excelAutoFolder=/Ledger/excel/month/
excelScreenFolder=/Ledger/excel/screen/
excelAnalysisFolder=/Ledger/excel/analysis/

# \u56FE\u7247\u4E0A\u4F20\u8DEF\u5F84
image.upload.path=/Ledger/images/

# \u8BA4\u8BC1\u6587\u4EF6\u8DEF\u5F84
auth.folder=/Ledger/auth/

# =====================================================
# SQL \u5907\u4EFD\u914D\u7F6E
# =====================================================
# \u5907\u4EFD\u6587\u4EF6\u8DEF\u5F84
sqlBackUpFolder=/Ledger/backup/

# \u5907\u4EFD\u547D\u4EE4
sqldumpCmd=/usr/bin/mysqldump -h ${MYSQL_HOST:db} -P ${MYSQL_PORT:3306} -u${MYSQL_USERNAME:root} -p${DB_PASSWORD:easy_accounts} --databases yd_jz >

# 恢复命令
sqlRestoreCmd=/usr/bin/mysql -h ${MYSQL_HOST:db} -P ${MYSQL_PORT:3306} -u${MYSQL_USERNAME:root} -p${DB_PASSWORD:easy_accounts} yd_jz <

# \u5907\u4EFD\u5B9A\u65F6\u4EFB\u52A1 cron \u8868\u8FBE\u5F0F\uFF08\u9ED8\u8BA4\u665A\u4E0A 22 \u70B9\uFF09
# SQL_BACKUP_TIME: \u81EA\u5B9A\u4E49\u5907\u4EFD\u65F6\u95F4
cron.sqlBackupTime=${SQL_BACKUP_TIME:0 0 22 * * ?}

# =====================================================
# \u8BA4\u8BC1\u914D\u7F6E
# =====================================================
# ENABLE_LOGIN: \u662F\u5426\u542F\u7528\u767B\u5F55\u8BA4\u8BC1\uFF08\u9ED8\u8BA4: false\uFF09
auth.enable=${ENABLE_LOGIN:false}

# EXPIRED_TIME: Token \u8FC7\u671F\u65F6\u95F4\uFF0C\u5206\u949F\uFF08\u9ED8\u8BA4: 30\uFF09
auth.expired=${EXPIRED_TIME:30}

# SINGLE_LOGIN: \u5355\u8BBE\u5907\u767B\u5F55\u6A21\u5F0F\uFF08\u9ED8\u8BA4: true\uFF09
#   true = \u65B0\u767B\u5F55\u8E22\u6389\u65E7\u8BBE\u5907
#   false = \u591A\u8BBE\u5907\u5171\u4EAB Token
auth.single_login=${SINGLE_LOGIN:true}

# =====================================================
# \u5916\u90E8\u670D\u52A1
# =====================================================
# WebHook \u670D\u52A1\u5730\u5740
webhook_url=http://webhook:8083/webhook

# \u963F\u91CC\u901A\u4E49\u5343\u95EE API Key (PR #3 by rockyshen)
# QWEN_API_KEY: \u4ECE\u73AF\u5883\u53D8\u91CF\u8BFB\u53D6
qwen.client.api-key=${QWEN_API_KEY:}

# =====================================================
# \u65E5\u5FD7\u914D\u7F6E
# =====================================================
logging.config=classpath:log4j2.xml

# =====================================================
# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
# =====================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

# =====================================================
# Tomcat \u914D\u7F6E
# =====================================================
server.tomcat.connection-timeout=60000
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# =====================================================
# Liquibase \u6570\u636E\u5E93\u8FC1\u79FB
# =====================================================
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# =====================================================
# \u7248\u672C\u4FE1\u606F
# =====================================================
version.release=2.6.0
version.code=261
version.font_branch=4.0.0
version.backend_branch=2.5.1
version.mysql_branch=2.5.0
version.agent_branch=1.1.0
version.webhook_branch=1.0.0

# \u4E91\u7AEF\u7248\u672C\u901A\u77E5 JSON \u5730\u5740\uFF08\u7528\u4E8E\u68C0\u67E5\u66F4\u65B0\uFF09
version.notice.url=https://blue-out-share.oss-cn-zhangjiakou.aliyuncs.com/version-notice.json
