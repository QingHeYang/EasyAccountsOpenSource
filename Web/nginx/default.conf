server {
    listen 80;

    server_name localhost;
    # 设置字符编码为utf-8
    charset utf-8;

    # 允许请求头中包含下划线（重要：支持 user_id）
    underscores_in_headers on;

    # 根据 User-Agent 检测移动设备
    set $entry_file "index.html";
    if ($http_user_agent ~* "(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile)") {
        set $entry_file "mobile.html";
    }

    # 前端入口（自动根据设备类型选择）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /$entry_file;
    }

    # 后端 API 代理 - 代理到内部网络的 server 服务
    location /api/ {
        proxy_pass http://server:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制（支持图片上传）
        client_max_body_size 20M;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AI WebSocket 连接代理
    location /ws/ {
        proxy_pass http://ai:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 确保转发所有请求头
        proxy_pass_request_headers on;
        proxy_set_header user_id $http_user_id;

        # WebSocket 超时设置（1小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE 代理 - Server-Sent Events 长连接
    location /sse/ {
        proxy_pass http://ai:8001/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # SSE 连接头（不是 WebSocket 的 upgrade）
        proxy_set_header Connection "";

        # 防止 nginx 缓冲响应
        proxy_set_header X-Accel-Buffering no;

        # 确保转发所有请求头
        proxy_pass_request_headers on;
        proxy_set_header user_id $http_user_id;

        # SSE 长连接超时（24小时）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP 代理 - Model Context Protocol
    location /mcp/ {
        proxy_pass http://ai:8001/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP 可能包含 SSE，禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;

        # Accept 头（MCP 需要同时支持 JSON 和 SSE）
        proxy_set_header Accept "application/json, text/event-stream";

        # 确保转发所有请求头
        proxy_pass_request_headers on;
        proxy_set_header user_id $http_user_id;

        # 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Messages 代理
    location /messages/ {
        proxy_pass http://ai:8001/messages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 可能包含流式响应，禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;

        # 确保转发所有请求头
        proxy_pass_request_headers on;
        proxy_set_header user_id $http_user_id;

        # 超时设置
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # AI HTTP API 代理
    location /ai/ {
        proxy_pass http://ai:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 确保转发所有请求头
        proxy_pass_request_headers on;
        proxy_set_header user_id $http_user_id;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源
    location /resources/ {
        alias /usr/share/nginx/html/resources/;
        autoindex on;
        charset utf-8;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

}
